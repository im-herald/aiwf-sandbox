# AIWF trusted review (D9) - RENDERED from template v2 (P2-C, repository mode PUBLIC_FULL).
# Rules: tools/ci-template-check.mjs --kind review; syntax: actionlint.
#
# The only accepted proof that the independent P0 reviewers really ran on a PR is an attestation
# signed by a key that only this workflow's signing job can read. Local review evidence comes from
# the developer machine (same OS user and credentials as the agent, D6 accepted) and is a process
# record only.
#
# Why pull_request_target: since 2025-12-08 GitHub always takes the workflow file AND the checkout
# ref of pull_request_target from the DEFAULT branch, and environment branch rules are evaluated
# against the default branch. A PR therefore cannot change this workflow, its engine pin or the owner
# policy, while the jobs can still use environment secrets restricted to main. That is also what makes
# it dangerous, so this workflow never executes code from the PR:
#   - the workspace is the default branch; the PR head is fetched as git DATA only (refs/remotes);
#   - no install / build / test command runs on PR content (tests run in aiwf-ci.yml, no secrets);
#   - the reviewers are Claude CLI processes restricted to Read/Glob/Grep/Skill inside the review
#     package (P0 profile); reviewer-directed text in added lines blocks before any reviewer starts;
#   - no ${{ github.event.* }} expression is interpolated into a shell command (env mapping only);
#   - review and sign run only for PRs from branches of THIS repository (no fork can spend the model
#     key); for a fork PR they are skipped and verify-attestation fails closed.
#
# Public repository: workflow logs and artifacts are readable by anyone. The reviewer transcripts
# contain the private review procedures, so they leave the review job only SEALED (X25519 public key
# pinned in the owner policy of the private engine). The signed statement itself is public.
#
# Key separation (three jobs, three environments, deployment branch policy "main" only):
#   review             aiwf-review: model credential only. Real P0 reviewers on merge-base -> PR head;
#                      writes an UNSIGNED, SEALED review record.
#   sign               aiwf-attest: signing key + evidence key, no model, no PR code. Opens the sealed
#                      record, re-validates the transcripts deterministically (P0 validator + D5),
#                      rebuilds the package for the same subject, signs, re-seals the transcripts.
#   verify-attestation aiwf-verify: evidence key only (no model, no signing key). Independent verifier:
#                      signature against the key pinned in the owner policy, subject, staleness,
#                      offline re-validation of the transcripts. REQUIRED status check on main.
#
# D6 (accepted): the agent shares the owner's GitHub credentials. Repository admins can change
# rulesets, environments and secrets; nothing here is a technical guarantee against an actor holding
# those credentials. See the P2-C security limitations.
name: aiwf-review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: aiwf-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: aiwf-review
    permissions:
      contents: read
    steps:
      - name: Check out the default branch (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the pinned AIWF engine (read-only deploy key, not persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: im-herald/aiwf-engine
          ref: 13fc3d35094ce453d9c81431eff27200c73a098d
          path: .aiwf-engine
          ssh-key: ${{ secrets.AIWF_ENGINE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Fetch the PR head as data (token scoped to this step only)
        env:
          AIWF_FETCH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$AIWF_FETCH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=$auth" fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/aiwf/pr-head"
          test "$(git rev-parse refs/remotes/aiwf/pr-head)" = "$PR_HEAD_SHA"

      - name: Node for the AIWF engine
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.2"

      - name: Claude Code CLI (exact version, global; nothing from the PR is installed)
        run: npm install --global "@anthropic-ai/claude-code@2.1.292"

      - name: Trusted review (real P0 reviewers, unsigned, sealed record)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [ -n "${ANTHROPIC_API_KEY:-}" ] || unset ANTHROPIC_API_KEY
          [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          node .aiwf-engine/plugin/aiwf/bin/aiwf.mjs ci review --repo . --base origin/main --head "$PR_HEAD_SHA" --review-only --seal --out aiwf-trusted-review

      - name: Upload the sealed review record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aiwf-trusted-review
          path: aiwf-trusted-review
          if-no-files-found: ignore
          retention-days: 30

  sign:
    name: sign
    needs: review
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: aiwf-attest
    permissions:
      contents: read
    steps:
      - name: Check out the default branch (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the pinned AIWF engine (read-only deploy key, not persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: im-herald/aiwf-engine
          ref: 13fc3d35094ce453d9c81431eff27200c73a098d
          path: .aiwf-engine
          ssh-key: ${{ secrets.AIWF_ENGINE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Fetch the PR head as data (token scoped to this step only)
        env:
          AIWF_FETCH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$AIWF_FETCH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=$auth" fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/aiwf/pr-head"
          test "$(git rev-parse refs/remotes/aiwf/pr-head)" = "$PR_HEAD_SHA"

      - name: Node for the AIWF engine
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.2"

      - name: Download the sealed review record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aiwf-trusted-review
          path: aiwf-trusted-review

      - name: Re-validate and sign (no model, no PR code)
        env:
          AIWF_ATTEST_SIGNING_KEY: ${{ secrets.AIWF_ATTEST_SIGNING_KEY }}
          AIWF_EVIDENCE_KEY: ${{ secrets.AIWF_EVIDENCE_KEY }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .aiwf-engine/plugin/aiwf/bin/aiwf.mjs ci sign --repo . --base origin/main --head "$PR_HEAD_SHA" --review-sealed aiwf-trusted-review/review.sealed.json --seal --out aiwf-attestation

      - name: Upload the attestation (public statement, sealed transcripts)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aiwf-attestation
          path: aiwf-attestation
          retention-days: 90

  verify-attestation:
    name: verify-attestation
    needs: sign
    # Runs even when review/sign failed or were skipped: a SKIPPED required check would count as
    # passing, so this job must run and fail closed (TRUSTED_REVIEW_MISSING) instead.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: aiwf-verify
    permissions:
      contents: read
    steps:
      - name: Check out the default branch (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the pinned AIWF engine (read-only deploy key, not persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: im-herald/aiwf-engine
          ref: 13fc3d35094ce453d9c81431eff27200c73a098d
          path: .aiwf-engine
          ssh-key: ${{ secrets.AIWF_ENGINE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Fetch the PR head as data (token scoped to this step only)
        env:
          AIWF_FETCH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$AIWF_FETCH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=$auth" fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/aiwf/pr-head"
          test "$(git rev-parse refs/remotes/aiwf/pr-head)" = "$PR_HEAD_SHA"

      - name: Node for the AIWF engine
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.2"

      - name: Download the attestation (absent when review or signing failed; the verifier then fails)
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aiwf-attestation
          path: aiwf-attestation

      - name: Verify the attestation (independent verifier; no model, no signing key)
        env:
          AIWF_EVIDENCE_KEY: ${{ secrets.AIWF_EVIDENCE_KEY }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .aiwf-engine/plugin/aiwf/bin/aiwf.mjs ci verify-attestation --repo . --base origin/main --head "$PR_HEAD_SHA" --attestation aiwf-attestation/attestation.json --out aiwf-attestation-check

      - name: Upload the verification record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aiwf-attestation-check
          path: aiwf-attestation-check
          retention-days: 90
