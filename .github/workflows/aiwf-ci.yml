# AIWF independent CI verification for PUBLIC repositories (RENDERED from template v4, P2-C, mode PUBLIC_FULL).
# Rules: tools/ci-template-check.mjs --rendered; syntax: actionlint.
#
# What it does, independently of the developer machine:
#   1. re-runs the project's `full` test tier on the checked-out head (pull_request: the merge result
#      of the PR into main), with the test adapter taken from the BASE branch;
#   2. re-classifies every non-merge commit (docs-only exception, governance paths, adapter checks);
#   3. reports governance-path changes and critical escalations as NEEDS_OWNER.
# Local evidence notes are NOT published in PUBLIC_FULL (the reviewer transcripts contain the
# private review procedures); review provenance is the signed attestation verified by
# aiwf-review / verify-attestation (base-branch workflow, required check).
#
# Security notes:
#   - pull_request only: PR code runs here, so this workflow is never trusted for review provenance;
#   - read-only permissions; checkouts do not persist credentials (project tests could read them);
#   - no ${{ github.event.* }} expression is interpolated into a shell command;
#   - the private engine is read with a read-only deploy key (repository secret). Same-repository PR
#     code can read that key during this job: anyone able to push a branch here can read the engine
#     source. Fork PRs receive no secrets (the job then fails closed). Accepted and documented (P2-C).
name: aiwf-ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aiwf-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the project (merge result, full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the base branch (token scoped to this step only)
        env:
          AIWF_FETCH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$AIWF_FETCH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=$auth" fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"

      - name: Node for the AIWF engine
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.2"

      - name: Python for the project's tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.15"

      - name: Check out the pinned AIWF engine (read-only deploy key, not persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: im-herald/aiwf-engine
          ref: 13fc3d35094ce453d9c81431eff27200c73a098d
          path: .aiwf-engine
          ssh-key: ${{ secrets.AIWF_ENGINE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Independent verification
        run: node .aiwf-engine/plugin/aiwf/bin/aiwf.mjs ci verify --repo . --base origin/main --head HEAD --out aiwf-ci --trusted-review deferred --local-evidence not-published

      - name: Upload verification record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aiwf-ci
          path: aiwf-ci
          retention-days: 30
