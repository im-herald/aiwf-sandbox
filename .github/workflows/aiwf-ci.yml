# AIWF deterministic CI (RENDERED by `aiwf ci render`; P2-C final architecture).
# Deterministic software checks only: no AI review, no model, no credentials, no secrets, no AIWF
# engine. AI reviews run locally (two independent Claude CLI reviewers); GitHub does not verify them.
# Required checks: aiwf-ci / tests, aiwf-ci / checks (no job-level if, no path filter: never skipped).
name: aiwf-ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aiwf-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.15"
      - name: "full tier: unit"
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          shopt -s nullglob globstar
          files=(tests/test_*.py)
          if [ "${#files[@]}" -eq 0 ]; then echo "::error::no test files match tests/test_*.py"; exit 1; fi
          status=0
          for f in "${files[@]}"; do
            echo "::group::$f"
            python -m unittest -v "$f" || { echo "::error::$f failed"; status=1; }
            echo "::endgroup::"
          done
          exit "$status"
      - name: "full tier: release"
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          shopt -s nullglob globstar
          files=(tests_release/test_*.py)
          if [ "${#files[@]}" -eq 0 ]; then echo "::error::no test files match tests_release/test_*.py"; exit 1; fi
          status=0
          for f in "${files[@]}"; do
            echo "::group::$f"
            python -m unittest -v "$f" || { echo "::error::$f failed"; status=1; }
            echo "::endgroup::"
          done
          exit "$status"

  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.15"
      - name: "syntax: compile all sources and tests"
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m compileall -q slugkit tests tests_release
      - name: "cli smoke"
        run: |
          out="$(python -m slugkit 'Hello, World!')"
          if [ "$out" != hello-world ]; then echo "::error::unexpected output: $out"; exit 1; fi
